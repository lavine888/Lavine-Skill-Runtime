name: One-time dependency lock refresh

on:
  push:
    branches: [chore/security-deps-20261025]

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Regenerate exact direct dependencies
        run: npm install --package-lock-only --save-exact next@16.4.3 ajv@8.20.0
      - name: Refresh vulnerable transitive dependencies
        run: npm audit fix --package-lock-only --omit=dev
      - name: Commit npm-generated package and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): update Next.js, Ajv and vulnerable lock dependencies"
            git push origin HEAD:chore/security-deps-20261025
          fi
