name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run skill:validate
      - run: npm run typecheck
      - run: npm test
      - run: npm run evals
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
